name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit + integration tests (mock HTTP server, temp git repos). No test
      # talks to a real vendor API.
      - run: cargo test --locked --all-targets
      - name: Template samples
        run: cargo run --locked -q -- templates test

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  termux:
    name: Termux (Android x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Builds with Termux's own Rust package and runs the full test suite,
      # template samples and a live HTTPS verification inside a real Termux
      # userland (Android bionic libc), via termux/termux-docker.
      - run: make test-termux

  self-scan:
    name: Scan this repository for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # Working tree and full history. Exits 183 if anything is found.
      - run: ./target/release/kubera scan fs . --exclude-path 'target/**' --fail
      - run: ./target/release/kubera scan git . --fail

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  installers:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Install the latest release into a scratch directory with each
      # installer (checksum verified), then run it.
      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sh -n install.sh
          KUBERA_INSTALL_DIR="$RUNNER_TEMP/kubera-bin" sh install.sh
          "$RUNNER_TEMP/kubera-bin/kubera" --version
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          $env:KUBERA_INSTALL_DIR = "$env:RUNNER_TEMP\kubera-bin"
          $env:KUBERA_NO_MODIFY_PATH = '1'
          Get-Content -Raw install.ps1 | Invoke-Expression
          & "$env:RUNNER_TEMP\kubera-bin\kubera.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Re-running upgrades in place.
          Get-Content -Raw install.ps1 | Invoke-Expression
      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:KUBERA_INSTALL_DIR = "$env:RUNNER_TEMP\kubera-bin-51"
          $env:KUBERA_NO_MODIFY_PATH = '1'
          Get-Content -Raw install.ps1 | Invoke-Expression
          & "$env:RUNNER_TEMP\kubera-bin-51\kubera.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
