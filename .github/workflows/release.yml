name: Release

# Publish a release in either of two ways:
#   * push a tag vX.Y.Z matching the Cargo.toml version, or
#   * run this workflow manually on main with `publish` checked: the tag
#     vX.Y.Z (from Cargo.toml, or the `version` input, which must match)
#     is created by the release step on the commit that was built.
# Either way, a release consists of:
#   * prebuilt binaries for Linux (x86_64, aarch64, i686, armv7, armv6,
#     riscv64), Android/Termux (aarch64, armv7, x86_64), macOS (Intel, Apple
#     silicon), Windows (x86_64, ARM64) and FreeBSD (x86_64), attached to a GitHub release, with SHA-256 checksums;
#   * the `kubera-cli` crate on crates.io (secret CARGO_REGISTRY_TOKEN);
#   * a multi-arch container image, ghcr.io/<owner>/kubera:<version> and
#     :latest, built from the same static Linux binaries;
#   * keyless Sigstore signatures (<asset>.sigstore.json, cosign) for every
#     archive, the CycloneDX SBOM and the manifests tarball, GitHub build
#     provenance attestations for them (gh attestation verify), and a
#     signed, attested image;
#   * package manager manifests (Homebrew, Scoop, winget, AUR).
# Pull requests that touch release inputs run the builds without publishing.

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "install.sh"
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (tag, GitHub release, crates.io, image). Off: build only."
        type: boolean
        default: false
      version:
        description: "Expected version without the v (optional; must match Cargo.toml)"
        type: string
        required: false
      complete:
        description: "Finish a release whose tag already exists (publishes only what is missing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Version + package check
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Release plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          VERSION_INPUT: ${{ inputs.version }}
          COMPLETE_INPUT: ${{ inputs.complete }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v${crate_version}"
          release=false
          if [ "$EVENT" = "push" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}" >&2
              exit 1
            fi
            release=true
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH_INPUT" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "manual releases run from main only (this is ${GITHUB_REF})" >&2
              exit 1
            fi
            if [ -n "$VERSION_INPUT" ] && [ "v${VERSION_INPUT#v}" != "$tag" ]; then
              echo "version input ${VERSION_INPUT} does not match Cargo.toml version ${crate_version}" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/$tag" >/dev/null; then
              if [ "$COMPLETE_INPUT" != "true" ]; then
                echo "tag ${tag} already exists; bump the version in Cargo.toml, or check" >&2
                echo "'complete' to finish a release that stopped part way" >&2
                exit 1
              fi
              mode=complete
            elif [ "$COMPLETE_INPUT" = "true" ]; then
              echo "'complete' finishes an existing release, but tag ${tag} does not exist" >&2
              exit 1
            fi
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "mode=${mode:-new}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release: $release, tag: $tag" >> "$GITHUB_STEP_SUMMARY"
      - run: cargo publish --dry-run --locked

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl binaries (any distro), glibc for RISC-V.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: i686-unknown-linux-musl, os: ubuntu-latest }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest }
          - { target: arm-unknown-linux-musleabihf, os: ubuntu-latest }
          - { target: riscv64gc-unknown-linux-gnu, os: ubuntu-latest }
          # Android / Termux.
          - { target: aarch64-linux-android, os: ubuntu-latest }
          - { target: armv7-linux-androideabi, os: ubuntu-latest }
          - { target: x86_64-linux-android, os: ubuntu-latest }
          # macOS, Windows, FreeBSD.
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-freebsd, os: ubuntu-latest }
    steps:
      # Completing an existing release builds from the tagged source, so
      # every asset of a release comes from the same code.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.mode == 'complete' && needs.check.outputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross toolchain
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name=kubera-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/kubera" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "kubera-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kubera.exe","README.md","LICENSE" "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $h = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: kubera-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release + crate
    if: needs.check.outputs.release == 'true'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless signing (Sigstore) and attestations
      attestations: write
    steps:
      # Completing an existing release publishes the crate from the tagged
      # source, so crates.io and the GitHub release always match.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.mode == 'complete' && needs.check.outputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      # Outside the checkout: cargo publish refuses a dirty working tree.
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          DIST: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Keep what is published; add only assets the release lacks
            # (e.g. targets added after it was cut). Never overwrite.
            have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            missing=()
            for f in "$DIST"/*; do
              grep -qxF "$(basename "$f")" <<< "$have" || missing+=("$f")
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "adding ${#missing[@]} asset(s) to $TAG"
              gh release upload "$TAG" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
            else
              echo "release $TAG already has every asset"
            fi
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # The pushed tag must exist and is used as is.
            target=(--verify-tag)
          else
            # Manual release: the release creates the tag on the commit
            # that was just built and tested.
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "$DIST"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "kubera $TAG" \
            --generate-notes \
            "${target[@]}"
      # CycloneDX SBOM of the released source (the tag in complete mode),
      # covering the dependencies of every target.
      - name: SBOM
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx --version 0.5.10
          cargo cyclonedx --format json --spec-version 1.5 --target all --override-filename "kubera-$TAG.cdx"
          mkdir -p "$RUNNER_TEMP/sbom"
          mv "kubera-$TAG.cdx.json" "$RUNNER_TEMP/sbom/"
      - uses: sigstore/cosign-installer@v4
      # Keyless signatures and provenance for what the release holds, never
      # replacing anything published: in complete mode only missing
      # signatures are added. Everything is signed as published (downloaded
      # back and checked against its .sha256), so signatures cover the bytes
      # users get even when this run rebuilt different ones.
      - name: Sign release assets
        id: sign
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          DIST: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          rel="$RUNNER_TEMP/release"
          mkdir -p "$rel" "$RUNNER_TEMP/bundles"
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          has() { grep -qxF "$1" <<< "$have"; }
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          # .sha256 files are `<hex>  <name>`, CRLF-terminated for Windows.
          check() {
            local want
            want=$(cut -d' ' -f1 < "$rel/$1.sha256" | tr -d '\r')
            [ "$(sha "$rel/$1")" = "$want" ] || { echo "$1 does not match $1.sha256" >&2; exit 1; }
          }
          # No attestation for this digest yet (the API answers 404).
          unattested() {
            local n
            n=$(gh api "repos/$GITHUB_REPOSITORY/attestations/sha256:$1" --jq '.attestations | length' 2>/dev/null) || n=0
            [ "${n:-0}" = "0" ]
          }

          sbom="kubera-$TAG.cdx.json"
          sbom_new=false
          if has "$sbom"; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$rel" --pattern "$sbom" --pattern "$sbom.sha256"
          else
            cp "$RUNNER_TEMP/sbom/$sbom" "$rel/"
            ( cd "$rel" && sha256sum "$sbom" > "$sbom.sha256" )
            gh release upload "$TAG" "$rel/$sbom" "$rel/$sbom.sha256" --repo "$GITHUB_REPOSITORY"
            sbom_new=true
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$rel" --skip-existing \
            --pattern 'kubera-*-*.tar.gz' --pattern 'kubera-*-*.zip' --pattern 'kubera-*.sha256'

          : > "$RUNNER_TEMP/provenance.sha256"
          : > "$RUNNER_TEMP/archives.sha256"
          for f in "$rel"/kubera-*.tar.gz "$rel"/kubera-*.zip "$rel/$sbom"; do
            name=$(basename "$f")
            case "$name" in kubera-packaging-*) continue ;; esac
            check "$name"
            if ! has "$name.sigstore.json"; then
              cosign sign-blob --yes --bundle "$RUNNER_TEMP/bundles/$name.sigstore.json" "$f"
            fi
            # Provenance only for bytes this run produced (everything in a
            # new release; in complete mode, the assets it added) and only
            # once per digest.
            sum=$(sha "$f")
            if [ "$name" = "$sbom" ]; then
              [ "$sbom_new" = true ] && echo "$sum  $name" >> "$RUNNER_TEMP/provenance.sha256"
            elif [ -f "$DIST/$name" ] && [ "$(sha "$DIST/$name")" = "$sum" ] && unattested "$sum"; then
              echo "$sum  $name" | tee -a "$RUNNER_TEMP/provenance.sha256" >> "$RUNNER_TEMP/archives.sha256"
            fi
          done

          shopt -s nullglob
          bundles=("$RUNNER_TEMP"/bundles/*.sigstore.json)
          if [ "${#bundles[@]}" -gt 0 ]; then
            echo "adding ${#bundles[@]} signature bundle(s) to $TAG"
            gh release upload "$TAG" "${bundles[@]}" --repo "$GITHUB_REPOSITORY"
          else
            echo "every asset of $TAG is already signed"
          fi
          echo "sbom=$rel/$sbom" >> "$GITHUB_OUTPUT"
          [ -s "$RUNNER_TEMP/provenance.sha256" ] && echo "provenance=true" >> "$GITHUB_OUTPUT"
          [ -s "$RUNNER_TEMP/archives.sha256" ] && echo "archives=true" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build provenance attestation
        if: steps.sign.outputs.provenance == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ runner.temp }}/provenance.sha256
      - name: SBOM attestation
        if: steps.sign.outputs.archives == 'true'
        uses: actions/attest-sbom@v4
        with:
          subject-checksums: ${{ runner.temp }}/archives.sha256
          sbom-path: ${{ steps.sign.outputs.sbom }}
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version="${TAG#v}"
          # crates.io versions are immutable: skip one that is already there.
          if curl -fsS -A "kubera-release (github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/${name}/${version}" >/dev/null 2>&1; then
            echo "${name} ${version} is already on crates.io"
            exit 0
          fi
          cargo publish --locked

  # Homebrew formula, Scoop manifest, winget manifests and AUR PKGBUILD,
  # rendered from packaging/templates/ with the checksums of the archives
  # actually published on the release (in complete mode those can predate
  # this run). Attached to the release as kubera-packaging-<tag>.tar.gz and
  # pushed to the tap, bucket, AUR and winget-pkgs when their secret is set;
  # each of those steps is skipped otherwise. See RELEASING.md.
  packages:
    name: Package manager manifests
    if: needs.check.outputs.release == 'true'
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # sign and attest the manifests tarball
      attestations: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      # Templates and scripts come from the workflow's commit; the version
      # and checksums come from the published release.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the published archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          patterns=()
          for a in x86_64-apple-darwin.tar.gz aarch64-apple-darwin.tar.gz \
                   x86_64-unknown-linux-musl.tar.gz aarch64-unknown-linux-musl.tar.gz \
                   armv7-unknown-linux-musleabihf.tar.gz \
                   x86_64-pc-windows-msvc.zip aarch64-pc-windows-msvc.zip; do
            patterns+=(--pattern "kubera-$a" --pattern "kubera-$a.sha256")
          done
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release" "${patterns[@]}"
      - name: Render manifests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/packaging"
          # Hashes every archive and checks it against its .sha256 file.
          python3 -I scripts/render-packages.py --version "${TAG#v}" \
            --assets "$RUNNER_TEMP/release" --require-archives \
            --out "$out" --tarball "$RUNNER_TEMP/kubera-packaging-$TAG.tar.gz"
          ruby -c "$out/homebrew/kubera.rb"
          ruby -rjson -e 'JSON.parse(File.read(ARGV[0]))' "$out/scoop/kubera.json"
          ruby -ryaml -e 'ARGV.each { |f| YAML.safe_load_file(f) }' "$out"/winget/*.yaml
          bash -n "$out/aur/PKGBUILD"
          cd "$RUNNER_TEMP"
          sha256sum "kubera-packaging-$TAG.tar.gz" > "kubera-packaging-$TAG.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: packaging-${{ needs.check.outputs.tag }}
          path: ${{ runner.temp }}/packaging
          include-hidden-files: true # aur/.SRCINFO
          if-no-files-found: error
      - uses: sigstore/cosign-installer@v4
      # Like the archives: add what is missing, never replace an asset.
      - name: Attach to the release
        id: attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          has() { grep -qxF "$1" <<< "$have"; }
          tarball="kubera-packaging-$TAG.tar.gz"
          cd "$RUNNER_TEMP"
          if has "$tarball"; then
            echo "release $TAG already has $tarball"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$tarball" --clobber
          else
            gh release upload "$TAG" "$tarball" "$tarball.sha256" --repo "$GITHUB_REPOSITORY"
            echo "subject=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"
          fi
          if ! has "$tarball.sigstore.json"; then
            cosign sign-blob --yes --bundle "$tarball.sigstore.json" "$tarball"
            gh release upload "$TAG" "$tarball.sigstore.json" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Provenance attestation
        if: steps.attach.outputs.subject != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.attach.outputs.subject }}
      # A token for <owner>/homebrew-tap with contents: write.
      - name: Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap (see RELEASING.md)"
            exit 0
          fi
          scripts/gh-put-file.sh "$GITHUB_REPOSITORY_OWNER/homebrew-tap" Formula/kubera.rb \
            "$RUNNER_TEMP/packaging/homebrew/kubera.rb" "kubera ${TAG#v}"
      # A token for <owner>/scoop-bucket with contents: write.
      - name: Scoop bucket
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SCOOP_BUCKET_TOKEN is not set; skipping the Scoop bucket (see RELEASING.md)"
            exit 0
          fi
          scripts/gh-put-file.sh "$GITHUB_REPOSITORY_OWNER/scoop-bucket" bucket/kubera.json \
            "$RUNNER_TEMP/packaging/scoop/kubera.json" "kubera ${TAG#v}"
      # The private SSH key registered on the AUR account that owns kubera-bin.
      - name: AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_GIT_NAME: ${{ github.repository_owner }}
          AUR_GIT_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; skipping the AUR (see RELEASING.md)"
            exit 0
          fi
          scripts/aur-push.sh "${TAG#v}" "$RUNNER_TEMP/packaging/aur"
      # A token that can push to <owner>/winget-pkgs (a fork of
      # microsoft/winget-pkgs) and open pull requests.
      - name: winget
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::WINGET_TOKEN is not set; skipping winget (manifests are in the release; see RELEASING.md)"
            exit 0
          fi
          scripts/winget-submit.sh "$GITHUB_REPOSITORY_OWNER" "${TAG#v}" "$RUNNER_TEMP/packaging/winget"

  image:
    name: Container image (linux/amd64, linux/arm64, linux/arm/v7)
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless image signature and provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kubera-*-unknown-linux-musl*
          merge-multiple: true
      - name: Unpack static binaries per architecture
        run: |
          set -euo pipefail
          for pair in x86_64-unknown-linux-musl:amd64 aarch64-unknown-linux-musl:arm64 \
                      armv7-unknown-linux-musleabihf:arm; do
            target="${pair%%:*}"; arch="${pair##*:}"
            ( cd artifacts && sha256sum -c "kubera-$target.tar.gz.sha256" )
            mkdir -p "dist/linux-$arch"
            tar -xzf "artifacts/kubera-$target.tar.gz" -C "dist/linux-$arch" --strip-components=1 "kubera-$target/kubera"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: needs.check.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kubera
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.check.outputs.release == 'true' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ needs.check.outputs.release == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit SBOM and provenance, stored with the image.
          sbom: true
          provenance: mode=max
      # Each push is a new digest, so it is always signed: complete mode
      # pushes the image again and signs that, nothing published is re-signed.
      - uses: sigstore/cosign-installer@v4
        if: needs.check.outputs.release == 'true'
      - name: Sign the image (keyless)
        if: needs.check.outputs.release == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kubera
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Image provenance attestation
        if: needs.check.outputs.release == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kubera
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Smoke test (amd64)
        run: |
          docker buildx build --load --target prebuilt --platform linux/amd64 -t kubera:smoke .
          docker run --rm kubera:smoke --version
          git init -q /tmp/r && docker run --rm -v /tmp/r:/scan kubera:smoke scan git /scan --fail
