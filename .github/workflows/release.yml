name: Release

# Publish a release in either of two ways:
#   * push a tag vX.Y.Z matching the Cargo.toml version, or
#   * run this workflow manually on main with `publish` checked: the tag
#     vX.Y.Z (from Cargo.toml, or the `version` input, which must match)
#     is created by the release step on the commit that was built.
# Either way, a release consists of:
#   * prebuilt binaries for Linux (static musl), macOS, Windows and Android
#     (Termux) attached to a GitHub release, with SHA-256 checksums;
#   * the `kubera-cli` crate on crates.io (secret CARGO_REGISTRY_TOKEN);
#   * a multi-arch container image, ghcr.io/<owner>/kubera:<version> and
#     :latest, built from the same static Linux binaries.
# Pull requests that touch release inputs run the builds without publishing.

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "install.sh"
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (tag, GitHub release, crates.io, image). Off: build only."
        type: boolean
        default: false
      version:
        description: "Expected version without the v (optional; must match Cargo.toml)"
        type: string
        required: false
      complete:
        description: "Finish a release whose tag already exists (publishes only what is missing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Version + package check
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Release plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          VERSION_INPUT: ${{ inputs.version }}
          COMPLETE_INPUT: ${{ inputs.complete }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v${crate_version}"
          release=false
          if [ "$EVENT" = "push" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}" >&2
              exit 1
            fi
            release=true
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH_INPUT" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "manual releases run from main only (this is ${GITHUB_REF})" >&2
              exit 1
            fi
            if [ -n "$VERSION_INPUT" ] && [ "v${VERSION_INPUT#v}" != "$tag" ]; then
              echo "version input ${VERSION_INPUT} does not match Cargo.toml version ${crate_version}" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/$tag" >/dev/null; then
              if [ "$COMPLETE_INPUT" != "true" ]; then
                echo "tag ${tag} already exists; bump the version in Cargo.toml, or check" >&2
                echo "'complete' to finish a release that stopped part way" >&2
                exit 1
              fi
              mode=complete
            elif [ "$COMPLETE_INPUT" = "true" ]; then
              echo "'complete' finishes an existing release, but tag ${tag} does not exist" >&2
              exit 1
            fi
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "mode=${mode:-new}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release: $release, tag: $tag" >> "$GITHUB_STEP_SUMMARY"
      - run: cargo publish --dry-run --locked

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-linux-android, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross toolchain
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name=kubera-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/kubera" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "kubera-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kubera.exe","README.md","LICENSE" "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $h = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: kubera-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release + crate
    if: needs.check.outputs.release == 'true'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Completing an existing release publishes the crate from the tagged
      # source, so crates.io and the GitHub release always match.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.mode == 'complete' && needs.check.outputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      # Outside the checkout: cargo publish refuses a dirty working tree.
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          DIST: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; keeping it"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # The pushed tag must exist and is used as is.
            target=(--verify-tag)
          else
            # Manual release: the release creates the tag on the commit
            # that was just built and tested.
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "$DIST"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "kubera $TAG" \
            --generate-notes \
            "${target[@]}"
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version="${TAG#v}"
          # crates.io versions are immutable: skip one that is already there.
          if curl -fsS -A "kubera-release (github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/${name}/${version}" >/dev/null 2>&1; then
            echo "${name} ${version} is already on crates.io"
            exit 0
          fi
          cargo publish --locked

  image:
    name: Container image (linux/amd64, linux/arm64)
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kubera-*-unknown-linux-musl
          merge-multiple: true
      - name: Unpack static binaries per architecture
        run: |
          set -euo pipefail
          for pair in x86_64:amd64 aarch64:arm64; do
            target="${pair%%:*}-unknown-linux-musl"; arch="${pair##*:}"
            ( cd artifacts && sha256sum -c "kubera-$target.tar.gz.sha256" )
            mkdir -p "dist/linux-$arch"
            tar -xzf "artifacts/kubera-$target.tar.gz" -C "dist/linux-$arch" --strip-components=1 "kubera-$target/kubera"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: needs.check.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kubera
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.check.outputs.release == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.check.outputs.release == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test (amd64)
        run: |
          docker buildx build --load --target prebuilt --platform linux/amd64 -t kubera:smoke .
          docker run --rm kubera:smoke --version
          git init -q /tmp/r && docker run --rm -v /tmp/r:/scan kubera:smoke scan git /scan --fail
