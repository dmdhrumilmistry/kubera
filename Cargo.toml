[package]
name = "kubera"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Template driven secret detection, verification, analysis and rotation"
repository = "https://github.com/dmdhrumilmistry/kubera"
readme = "README.md"
keywords = ["security", "secrets", "scanner", "leak", "rotation"]
categories = ["command-line-utilities"]

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
globset = "0.4.21"
hex = "0.4.3"
hmac = "0.13.0"
include_dir = "0.7.4"
owo-colors = "4.4.0"
percent-encoding = "2.3.2"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
walkdir = "2.5.0"

# Android (e.g. Termux): fallback trust roots, see src/http/tls.rs.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
