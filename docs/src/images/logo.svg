<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Kubera logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2233"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f5b700"/>
    </linearGradient>
    <linearGradient id="pav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b700"/>
      <stop offset="1" stop-color="#d9770f"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#f5b700" stroke-opacity="0.25" stroke-width="2"/>
  <!-- crown -->
  <polygon points="28,48 46,28 82,28 100,48" fill="url(#crown)"/>
  <polygon points="46,28 64,48 82,28" fill="#fff1c2" fill-opacity="0.55"/>
  <polygon points="28,48 46,28 64,48" fill="#ffd34d" fill-opacity="0.35"/>
  <!-- pavilion -->
  <polygon points="28,48 100,48 64,104" fill="url(#pav)"/>
  <polygon points="46,48 64,104 28,48" fill="#ffc21a" fill-opacity="0.45"/>
  <polygon points="82,48 100,48 64,104" fill="#b85a00" fill-opacity="0.35"/>
  <line x1="28" y1="48" x2="100" y2="48" stroke="#fff1c2" stroke-opacity="0.8" stroke-width="1.5"/>
  <!-- keyhole -->
  <circle cx="64" cy="60" r="7.5" fill="#0b1020"/>
  <polygon points="59.5,63 68.5,63 71,82 57,82" fill="#0b1020"/>
  <!-- sparkle -->
  <path d="M100 18 l2.5 6.5 l6.5 2.5 l-6.5 2.5 l-2.5 6.5 l-2.5 -6.5 l-6.5 -2.5 l6.5 -2.5 z" fill="#ffe08a"/>
</svg>
