id: age-secret-key
name: age Secret Key
platform: age
description: age encryption identity (decrypts every file encrypted to its recipient).
severity: high
tags: [crypto]
references:
  - https://github.com/FiloSottile/age
detect:
  keywords: [AGE-SECRET-KEY-1]
  patterns:
    - name: key
      regex: '\b(AGE-SECRET-KEY-1[0-9A-Z]{58})\b'
rotate:
  instructions: |
    Generate a new identity (`age-keygen`), re-encrypt the affected files to
    the new recipient, and remove the old recipient everywhere (sops etc.).
tests:
  positive:
    - "A{{'G'}}E-SECRET-KEY-1ITLJMN3JSD4G65KNQBZK8426E32KLEXNCDDZ6S3XPOFHUC8BEHZ5ZTG0LF"
  negative:
    - "AGE-SECRET-KEY-1SHORT"
