id: gcp-service-account-key
name: Google Cloud Service Account Key
platform: Google Cloud
description: Service account JSON key (client email + private key id); the private key itself is also reported by `private-key`.
severity: critical
tags: [cloud, iam]
references:
  - https://cloud.google.com/iam/docs/keys-create-delete
detect:
  keywords: [gserviceaccount.com]
  max_distance: 4096
  patterns:
    - name: private_key_id
      regex: '"private_key_id"\s*:\s*"([a-f0-9]{40})"'
    - name: client_email
      regex: '"client_email"\s*:\s*"([a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com)"'
      secret: false
rotate:
  instructions: |
    Create a new key (or move to Workload Identity), deploy it, then delete
    the leaked key:
      gcloud iam service-accounts keys delete <private_key_id> --iam-account <client_email>
    Review Cloud Audit Logs for the key's activity.
tests:
  positive:
    - |
      {"type": "service_account", "project_id": "acme",
       "private_key_id": "71c8ee0976335e682a60db17f78ff5f48efc8d1a",
       "client_email": "deployer@acme.iam.g{{'s'}}erviceaccount.com"}
  negative:
    - '"client_email": "user@example.com"'
