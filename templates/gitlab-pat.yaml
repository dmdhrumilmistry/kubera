id: gitlab-pat
name: GitLab Personal Access Token
platform: GitLab
description: GitLab.com personal access token. Copy this template and change the host for self-managed GitLab.
severity: critical
tags: [vcs, supply-chain]
references:
  - https://docs.gitlab.com/ee/api/personal_access_tokens.html
  - https://docs.gitlab.com/ee/api/personal_access_tokens.html#rotate-a-personal-access-token

detect:
  keywords: [glpat-]
  patterns:
    - name: token
      regex: '\b(glpat-[0-9A-Za-z_-]{20}(?:[0-9A-Za-z_.-]{0,60}[0-9A-Za-z_-])?)'
      min_entropy: 3.5

verify:
  request:
    url: https://gitlab.com/api/v4/user
    headers: { PRIVATE-TOKEN: "{{ token }}" }
  valid: { status: [200] }
  invalid: { status: [401] }
  extract:
    - { name: username, label: User, json: username }
    - { name: email, label: Email, json: email }
    - { name: is_admin, label: Admin, json: is_admin }

analyze:
  steps:
    - name: token_info
      description: Metadata of the token itself
      request:
        url: https://gitlab.com/api/v4/personal_access_tokens/self
        headers: { PRIVATE-TOKEN: "{{ token }}" }
      extract:
        - { name: token_name, label: Name, json: name }
        - { name: scopes, label: Scopes, json: scopes }
        - { name: expires_at, label: Expires, json: expires_at }
        - { name: last_used_at, label: Last used, json: last_used_at }
    - name: writable_projects
      description: Projects where the user has Developer access or higher
      request:
        url: https://gitlab.com/api/v4/projects
        query: { membership: "true", min_access_level: "30", per_page: "100", simple: "true" }
        headers: { PRIVATE-TOKEN: "{{ token }}" }
      extract:
        - { name: projects, label: Projects, json: "*.path_with_namespace" }

rotate:
  instructions: |
    GitLab rotates the token in place: a new token with the same scopes is
    issued and the leaked one is revoked immediately. Requires the `api` or
    `self_rotate` scope (GitLab 16.10+). The new token expires after one week
    unless your instance policy says otherwise - adjust it in the UI.
  steps:
    - name: rotate
      description: POST /personal_access_tokens/self/rotate
      request:
        method: POST
        url: https://gitlab.com/api/v4/personal_access_tokens/self/rotate
        headers: { PRIVATE-TOKEN: "{{ token }}" }
      expect: { status: [200] }
      extract:
        - { name: new_token, json: token, secret: true }
        - { name: new_expires_at, label: Expires, json: expires_at }
  outputs: [new_token, new_expires_at]

tests:
  positive:
    - "GITLAB_TOKEN=glpa{{'t'}}-Zx9Qw2Er5Ty8Ui1Op4As"
  negative:
    - "glpat-xxxxxxxxxxxxxxxxxxxx"
    - "glpat-short"
