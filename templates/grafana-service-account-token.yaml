id: grafana-service-account-token
name: Grafana Service Account Token
platform: Grafana
description: Grafana service account token (glsa_) with the Grafana Cloud stack it belongs to. Acts with the service account's role.
severity: high
tags: [observability]
references:
  - https://grafana.com/docs/grafana/latest/administration/service-accounts/
  - https://grafana.com/docs/grafana/latest/developers/http_api/user/#actual-user
detect:
  keywords: [glsa_]
  max_distance: 1024
  patterns:
    - name: token
      regex: '\b(glsa_[A-Za-z0-9]{32}_[a-f0-9]{8})\b'
    - name: host
      regex: '\b([a-z0-9][a-z0-9-]{0,62}\.grafana\.net)\b'
      secret: false
      optional: true
verify:
  # /api/user rejects anonymous access, so an instance with anonymous
  # viewing enabled still answers 401 for a bad token.
  request:
    url: "https://{{ host }}/api/user"
    auth: { type: bearer, token: "{{ token }}" }
  valid: { status: [200] }
  invalid: { status: [401] }
  extract:
    - { name: login, label: Service account, json: login }
    - { name: org_id, label: Org, json: orgId }
analyze:
  steps:
    - name: org
      description: Organization the token belongs to
      request:
        url: "https://{{ host }}/api/org"
        auth: { type: bearer, token: "{{ token }}" }
      extract:
        - { name: org_name, label: Organization, json: name }
rotate:
  instructions: |
    Grafana -> Administration -> Users and access -> Service accounts -> the
    account: add a new token, deploy it, then delete the leaked token.
    Tokens from self-hosted Grafana are reported with an unknown status when
    no *.grafana.net host is nearby; verify them against your own instance.
tests:
  positive:
    - |
      GRAFANA_URL=https://acme.grafana.net
      GRAFANA_TOKEN=g{{'l'}}sa_JRUlWebFXwxl8wVZLXplVGEyewO433Do_6b8a0848
    - "GRAFANA_SA_TOKEN=g{{'l'}}sa_JRUlWebFXwxl8wVZLXplVGEyewO433Do_6b8a0848"
  negative:
    - "glsa_short_abc"
