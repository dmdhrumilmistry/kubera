id: mapbox-secret-token
name: Mapbox Secret Token
platform: Mapbox
description: Mapbox secret access token (sk.).
severity: medium
tags: [maps]
references:
  - https://docs.mapbox.com/api/accounts/tokens/#retrieve-a-token
detect:
  keywords: [sk.eyJ]
  patterns:
    - name: token
      regex: '\b(sk\.eyJ[A-Za-z0-9_-]{50,}\.[A-Za-z0-9_-]{20,})\b'
verify:
  request:
    url: https://api.mapbox.com/tokens/v2
    query: { access_token: "{{ token }}" }
  valid:
    status: [200]
    json: [{ path: code, equals: TokenValid }]
  invalid:
    any:
      - { status: [401] }
      - { json: [{ path: code, equals: TokenInvalid }] }
      - { json: [{ path: code, equals: TokenExpired }] }
      - { json: [{ path: code, equals: TokenRevoked }] }
  extract:
    - { name: user, label: User, json: token.user }
    - { name: scopes, label: Scopes, json: token.scopes }
rotate:
  instructions: |
    account.mapbox.com/access-tokens: delete or rotate the leaked secret token.
tests:
  positive:
    - "MAPBOX_SECRET=sk.{{'e'}}yJJWilnz3SFp0rs59SEvBiB1JSDJKImn83uzGAOx1vE1jpQR1RSP25QSCm3lNJ.f16kHgkO6i2wSD30xwoxJ8"
  negative:
    - "pk.eyJ1IjoiZXhhbXBsZSJ9.abc"
