id: notion-token
name: Notion Integration Token
platform: Notion
description: Notion internal integration secret (read/write every page shared with the integration).
severity: high
tags: [productivity]
references:
  - https://developers.notion.com/reference/get-self
detect:
  keywords: [secret_, ntn_]
  patterns:
    - name: token
      regex: '\b((?:secret_[A-Za-z0-9]{43})|(?:ntn_[0-9]{11}[A-Za-z0-9]{35}))\b'
      min_entropy: 3.5
verify:
  request:
    url: https://api.notion.com/v1/users/me
    headers: { Notion-Version: "2022-06-28" }
    auth: { type: bearer, token: "{{ token }}" }
  valid: { status: [200] }
  invalid: { status: [401] }
  extract:
    - { name: name, label: Integration, json: name }
    - { name: workspace, label: Workspace, json: bot.workspace_name }
rotate:
  instructions: |
    notion.so/my-integrations -> your integration -> Secrets -> Refresh.
    Deploy the new secret; the old one stops working.
tests:
  positive:
    - "NOTION_TOKEN=n{{'t'}}n_90177130308AbOVpHIk56xUXWgJ0E0V5b7TFobylemwhfj"
    - "NOTION_TOKEN=s{{'e'}}cret_7vPrW6XuZtqg7ZzUCnxxMxN623t3zmda11A354yBz3E"
  negative:
    - "secret_short"
