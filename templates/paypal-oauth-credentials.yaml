id: paypal-oauth-credentials
name: PayPal REST API Credentials
platform: PayPal
description: PayPal REST app client id + secret.
severity: critical
tags: [payments]
references:
  - https://developer.paypal.com/api/rest/authentication/
detect:
  keywords: [paypal]
  max_distance: 1024
  patterns:
    - name: client_id
      regex: '\b(A[A-Za-z0-9_-]{79})\b'
      secret: false
      min_entropy: 4.0
    - name: client_secret
      regex: '\b(E[A-Za-z0-9_-]{79})\b'
      min_entropy: 4.0
verify:
  # OAuth client-credentials grant: a form POST with basic auth.
  request:
    method: POST
    url: https://api-m.paypal.com/v1/oauth2/token
    auth: { type: basic, username: "{{ client_id }}", password: "{{ client_secret }}" }
    form: { grant_type: client_credentials }
  valid: { status: [200] }
  invalid: { status: [401] }
  extract:
    - { name: app_id, label: App, json: app_id }
    - { name: scope, label: Scopes, json: scope }
  fallbacks:
    - label: Sandbox
      request:
        method: POST
        url: https://api-m.sandbox.paypal.com/v1/oauth2/token
        auth: { type: basic, username: "{{ client_id }}", password: "{{ client_secret }}" }
        form: { grant_type: client_credentials }
rotate:
  instructions: |
    developer.paypal.com -> Apps & Credentials -> your app: generate a new
    secret, deploy it, then delete the leaked secret.
tests:
  positive:
    - |
      P{{'A'}}YPAL_CLIENT_ID=AXMkQ{{'m'}}trN5RdGIC18Gz4A2EBKb5QaVLXoYy4ja0RgXn0BbTrSK8WL1bZSxQEgvlwaCDlIK5lG7OVnEdG
      P{{'A'}}YPAL_SECRET=E59zX{{'E'}}MRJm9rnYrLAE34Hga7cn3FgQX9xzZHxDkUVs07fDlkCp9dEQXa2vWkTAlA5XvdDJ1IaUyqiJSF
  negative:
    - "PAYPAL_CLIENT_ID=AXXX"
