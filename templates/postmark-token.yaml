id: postmark-token
name: Postmark Server / Account Token
platform: Postmark
description: Postmark server token (send email) or account token (manage servers).
severity: high
tags: [email]
references:
  - https://postmarkapp.com/developer/api/overview#authentication
detect:
  keywords: [postmark]
  patterns:
    - name: token
      regex: '(?i:postmark)[^\n]{0,40}?\b([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'
verify:
  request:
    url: https://api.postmarkapp.com/server
    headers:
      Accept: application/json
      X-Postmark-Server-Token: "{{ token }}"
  valid: { status: [200] }
  invalid: { status: [401] }
  extract:
    - { name: server, label: Server, json: Name }
  fallbacks:
    - label: account token
      request:
        url: https://api.postmarkapp.com/servers
        query: { count: "50", offset: "0" }
        headers:
          Accept: application/json
          X-Postmark-Account-Token: "{{ token }}"
rotate:
  instructions: |
    Postmark -> Servers -> API Tokens (or Account -> API Tokens): regenerate
    the leaked token and deploy the new one.
tests:
  positive:
    - "P{{'O'}}STMARK_SERVER_TOKEN=7c7dff11-b4e8-41b2-45e7-c89895801685"
  negative:
    - "SERVER_TOKEN=9b4fbd88-eed9-143d-1de9-e84675d11d73"
