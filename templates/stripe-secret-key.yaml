id: stripe-secret-key
name: Stripe Live Secret Key
platform: Stripe
description: Live-mode secret (sk_live_) or restricted (rk_live_) API key.
severity: critical
tags: [payments]
references:
  - https://docs.stripe.com/keys
  - https://docs.stripe.com/keys#rolling-keys

detect:
  keywords: [sk_live_, rk_live_]
  patterns:
    - name: key
      regex: '\b((?:sk|rk)_live_[0-9A-Za-z]{24,247})\b'
      min_entropy: 3.5

verify:
  request:
    url: https://api.stripe.com/v1/balance
    auth: { type: basic, username: "{{ key }}" }
  # Restricted keys without balance access get 403, which still proves the
  # key is live.
  valid: { status: [200, 403] }
  invalid: { status: [401] }

analyze:
  notes: |
    Each probe below performs a harmless read (limit=1). A failed probe means
    the key lacks that permission (typical for restricted keys).
  steps:
    - name: account
      description: Account the key belongs to
      request: &stripe
        url: https://api.stripe.com/v1/account
        auth: { type: basic, username: "{{ key }}" }
      extract:
        - { name: account_id, label: Account, json: id }
        - { name: email, label: Email, json: email }
        - { name: business, label: Business, json: business_profile.name }
        - { name: country, label: Country, json: country }
        - { name: charges_enabled, label: Charges enabled, json: charges_enabled }
    - name: read_charges
      description: Can read charges
      request: { <<: *stripe, url: https://api.stripe.com/v1/charges, query: { limit: "1" } }
    - name: read_customers
      description: Can read customers (PII)
      request: { <<: *stripe, url: https://api.stripe.com/v1/customers, query: { limit: "1" } }
    - name: read_payouts
      description: Can read payouts
      request: { <<: *stripe, url: https://api.stripe.com/v1/payouts, query: { limit: "1" } }
    - name: read_webhooks
      description: Can read webhook endpoints
      request: { <<: *stripe, url: https://api.stripe.com/v1/webhook_endpoints, query: { limit: "1" } }

rotate:
  instructions: |
    Stripe does not expose an API to roll API keys.
    1. Dashboard -> Developers -> API keys -> "Roll key" on the leaked key.
       Choose an expiry for the old key long enough to deploy the new one
       (or "now" if it is being abused).
    2. Deploy the new key; prefer restricted keys (rk_live_) with minimal
       permissions.
    3. Review Dashboard -> Developers -> Logs for unexpected requests.

tests:
  positive:
    - "STRIPE_KEY=sk_{{'live'}}_51Hq3xYzAbC9dEfGhJkLmNoP2qRsTuVwX"
  negative:
    - "sk_test_51Hq3xYzAbC9dEfGhJkLmNoP2qRsTuVwX"
    - "sk_live_xxxxxxxxxxxxxxxxxxxxxxxxxxxx"
