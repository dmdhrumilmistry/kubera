id: terraform-cloud-token
name: Terraform Cloud / HCP Terraform Token
platform: HashiCorp
description: Terraform Cloud user, team or organization API token (workspaces, state, variables).
severity: critical
tags: [infrastructure]
references:
  - https://developer.hashicorp.com/terraform/cloud-docs/api-docs/account
detect:
  keywords: [atlasv1]
  patterns:
    - name: token
      regex: '\b([A-Za-z0-9]{14}\.atlasv1\.[A-Za-z0-9_=-]{60,70})\b'
verify:
  request:
    url: https://app.terraform.io/api/v2/account/details
    auth: { type: bearer, token: "{{ token }}" }
  # Team/org tokens are not users (404) but are live.
  valid: { status: [200, 404] }
  invalid: { status: [401] }
  extract:
    - { name: username, label: User, json: data.attributes.username }
    - { name: email, label: Email, json: data.attributes.email }
rotate:
  instructions: |
    HCP Terraform -> User / Team / Organization settings -> Tokens: delete the
    leaked token and create a new one. Rotate any cloud credentials stored as
    workspace variables if the token could read them.
tests:
  positive:
    - "token = \"m9XEr6dXlWo0fO.a{{'t'}}lasv1.EkLjHex8laYi9sALgn1llpKZUSZ4iZOIZ3RMaWDB8VRbB02iaB5FEodr9vjqoMWqdrB\""
  negative:
    - "x.atlasv1.y"
